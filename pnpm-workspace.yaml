allowBuilds:
  better-sqlite3: true
  protobufjs: true
  sharp: true
# GHSA-mrhx-c7xc-m3w5: zod memory DoS on oversized constrained collections.
# Only fixed in zod >=4.6.6, but @atproto/oauth-provider pins zod ^3.23.8
# because it uses the v3-only .refinement() API. Forcing zod to 4.x breaks
# runtime. This sandbox is network-isolated and does not accept adversarial
# input (see CLAUDE.md), so the practical risk here is negligible.
auditConfig:
  ignoreGhsas:
    - GHSA-mrhx-c7xc-m3w5
overrides:
  '@fastify/busboy': '3.2.2'
  sharp: '0.35.5'
  kysely: '0.29.6'
  nodemailer: '10.1.4'
  undici: '6.29.1'
  qs: '6.16.1'
  follow-redirects: '1.16.2'
  glob: '14.0.2'
  minimatch: '11.0.1'
  '@opentelemetry/propagator-jaeger': '2.12.0'
  '@opentelemetry/instrumentation-cassandra-driver': '0.66.0'
  '@opentelemetry/instrumentation-knex': '0.65.0'
  '@opentelemetry/instrumentation-mongoose': '0.67.0'
  '@opentelemetry/instrumentation-mysql': '0.67.0'
  '@opentelemetry/instrumentation-mysql2': '0.67.0'
  '@opentelemetry/instrumentation-oracledb': '0.46.0'
  '@opentelemetry/instrumentation-pg': '0.73.0'
  '@opentelemetry/instrumentation-tedious': '0.40.0'
